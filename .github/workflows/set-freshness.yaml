name: Set Freshness Status

on:
  workflow_call:
    inputs:
      context_name:
        required: false
        type: string
        default: "CONTEXT.md"

permissions:
  statuses: write

jobs:
  set-status:
    runs-on: ubuntu-latest
    steps:
      - name: Set status on merge commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.event.pull_request.merge_commit_sha }}"
          if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
            SHA=$(gh api repos/${{ github.repository }}/commits/${{ github.event.repository.default_branch }} --jq .sha)
          fi

          gh api repos/${{ github.repository }}/statuses/$SHA \
            -f state=success \
            -f context=freshness/${{ inputs.context_name }} \
            -f description="checked $(date -u +%FT%TZ)" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
