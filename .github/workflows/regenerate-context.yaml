name: Regenerate Context File

on:
  workflow_call:
    outputs:
      changed:
        description: "Whether CONTEXT regeneration produced changes"
        value: ${{ jobs.regenerate.outputs.changed }}
    inputs:
      context_file:
        description: "Path (relative to repo root) of the context file to keep up to date."
        required: false
        type: string
        default: "AI/CONTEXT.md"
      base_branch:
        description: "Branch to check out and open the pull request against."
        required: false
        type: string
        default: "acc"
      tree_dirs:
        description: 'Comma-separated list of directories (relative to repo root) to summarize for the model. Use "." for the repo root.'
        required: false
        type: string
        default: "."
      model:
        description: "OpenAI model to use for regenerating the context file."
        required: false
        type: string
        default: "gpt-5.6"
      prompt_addition:
        description: "Optional extra instructions appended to the default system prompt (e.g. repo-specific conventions)."
        required: false
        type: string
        default: ""
    secrets:
      OPENAI_API_KEY:
        description: "API key for the OpenAI account used to regenerate the context file."
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Check for non-automation commits since last context PR merge
        id: guard
        env:
          CONTEXT_FILE: ${{ inputs.context_file }}
        run: |
          set -euo pipefail

          echo "case_mismatch_path=" >> "$GITHUB_OUTPUT"

          if [ ! -f "$CONTEXT_FILE" ]; then
            LOWER_CONTEXT_FILE="$(printf '%s' "$CONTEXT_FILE" | tr '[:upper:]' '[:lower:]')"
            CASE_MATCHES="$(find . -path ./.git -prune -o -type f -print \
              | sed 's#^\./##' \
              | awk -v target="$LOWER_CONTEXT_FILE" 'tolower($0)==target {print}')"
            CASE_MATCH_COUNT="$(printf '%s\n' "$CASE_MATCHES" | sed '/^$/d' | wc -l | tr -d ' ')"

            if [ "$CASE_MATCH_COUNT" -gt 1 ]; then
              echo "Multiple case-insensitive matches found for ${CONTEXT_FILE}; please clean up manually:" >&2
              printf '%s\n' "$CASE_MATCHES" >&2
              exit 1
            fi

            if [ "$CASE_MATCH_COUNT" -eq 1 ]; then
              CASE_MISMATCH_PATH="$(printf '%s\n' "$CASE_MATCHES" | sed -n '1p')"
              if [ "$CASE_MISMATCH_PATH" != "$CONTEXT_FILE" ]; then
                echo "Found case-mismatched file ${CASE_MISMATCH_PATH}; forcing regeneration to canonical path ${CONTEXT_FILE}."
                echo "case_mismatch_path=${CASE_MISMATCH_PATH}" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "${CONTEXT_FILE} does not exist; forcing regeneration."
            fi

            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Marker commits created by this workflow when regeneration PRs are merged.
          LAST_AUTOMATION_COMMIT="$(git log --format='%H' -n 1 \
            --grep='^chore: regenerate ' \
            --grep='^Merge pull request .* from .*/chore/context-update-')"

          if [ -z "$LAST_AUTOMATION_COMMIT" ]; then
            echo "No prior automation merge marker found; proceeding with regeneration."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Count commits since the last marker, excluding commits generated by this
          # automation itself, to prevent infinite regeneration loops.
          NON_AUTOMATION_COUNT="$(git log --format='%H' "${LAST_AUTOMATION_COMMIT}..HEAD" \
            --invert-grep \
            --grep='^chore: regenerate ' \
            --grep='^Merge pull request .* from .*/chore/context-update-' \
            | wc -l | tr -d ' ')"

          if [ "$NON_AUTOMATION_COUNT" -eq 0 ]; then
            echo "No non-automation commits since last context PR merge; skipping regeneration."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found $NON_AUTOMATION_COUNT non-automation commit(s) since last context PR merge."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Gather repo context
        if: steps.guard.outputs.should_run == 'true'
        id: context
        env:
          CONTEXT_FILE: ${{ inputs.context_file }}
          CASE_MISMATCH_PATH: ${{ steps.guard.outputs.case_mismatch_path }}
          TREE_DIRS: ${{ inputs.tree_dirs }}
        run: |
          mkdir -p .tmp

          if [ -f "$CONTEXT_FILE" ]; then
            cp "$CONTEXT_FILE" .tmp/context.md
          elif [ -n "$CASE_MISMATCH_PATH" ] && [ -f "$CASE_MISMATCH_PATH" ]; then
            cp "$CASE_MISMATCH_PATH" .tmp/context.md
          else
            : > .tmp/context.md
          fi

          # Exclude commits generated by this automation to avoid self-triggering
          # context updates when the previous regeneration PR was recently merged.
          git log --oneline --stat --since="7 days ago" \
            --invert-grep \
            --grep='^chore: regenerate ' \
            --grep='^Merge pull request .* from .*/chore/context-update-' \
            > .tmp/git-log.txt

          : > .tmp/repo-tree.txt
          IFS=',' read -ra DIRS <<< "$TREE_DIRS"
          for raw_dir in "${DIRS[@]}"; do
            dir="$(echo "$raw_dir" | xargs)"
            [ -z "$dir" ] && continue
            if [ "$dir" = "." ]; then
              echo "--- repo root ---" >> .tmp/repo-tree.txt
              find . -maxdepth 2 -not -path './.git*' -not -path './.tmp*' | sort >> .tmp/repo-tree.txt
            else
              echo "--- ${dir}/ ---" >> .tmp/repo-tree.txt
              find "$dir" -maxdepth 2 2>/dev/null | sort >> .tmp/repo-tree.txt
            fi
          done

      - name: Call OpenAI API to regenerate context file
        if: steps.guard.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONTEXT_FILE: ${{ inputs.context_file }}
          MODEL: ${{ inputs.model }}
          PROMPT_ADDITION: ${{ inputs.prompt_addition }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import re
          from datetime import datetime, timezone
          import urllib.request
          import urllib.error

          context_file = os.environ['CONTEXT_FILE']

          system_prompt = (
              "You are a technical documentation maintainer responsible for keeping a repository's "
              f"{context_file} file accurate and up to date. You will be given the current file, a "
              "summary of recent git history, and the repository's directory structure. Update the "
              "file so it accurately reflects the current state of the repository. "
              ""
              "Use a strict minimal-edit approach: preserve unchanged text byte-for-byte whenever "
              "possible. Only modify sections directly justified by the provided inputs. Do not "
              "reformat, reorder, rename headings, or compress detailed sections into short summaries "
              "unless required by real repository changes or to fix invalid syntax. "
              ""
              "When an existing context file is substantial, preserve its structure, section coverage, "
              "and level of detail. Avoid dropping tables, lists, caveats, and architecture notes unless "
              "the inputs clearly show they are obsolete. "
              ""
              "The frontmatter must include a `summary:` field, alongside domain, main_systems, "
              "owner, criticality, last_reviewed, and review_confidence. "
              ""
              "The summary field is used by an LLM to decide whether this repository is relevant; keep "
              "it aligned with domain and main_systems. "
              ""
              "Fields must be well-formed YAML that can be parsed by an LLM or human without errors. "
              ""
              "Return ONLY the full updated file content — no explanation, no markdown code fence, "
              "no surrounding text of any kind."
          )

          prompt_addition = os.environ.get('PROMPT_ADDITION', '').strip()
          if prompt_addition:
              system_prompt += "\n\n" + prompt_addition

          with open('.tmp/context.md', 'r', encoding='utf-8') as f:
              context_md = f.read()

          with open('.tmp/git-log.txt', 'r', encoding='utf-8') as f:
              git_log = f.read().strip()

          with open('.tmp/repo-tree.txt', 'r', encoding='utf-8') as f:
              repo_tree = f.read()

          required_h2_headings = [
              "## Overview",
              "## Purpose and responsibilities",
              "## Source of truth / data ownership",
              "## External integrations",
              "## APIs exposed",
              "## APIs / services consumed",
              "## Deployment",
              "## Architectural notes and key decisions",
              "## Known risks / fragile areas",
              "## AI assistant guidance",
              "## Roadmap / active migrations",
              "## Freshness",
          ]

          template_frontmatter_fields = [
              "repo",
              "project_name",
              "owner",
              "domain",
              "criticality",
              "summary",
              "main_stack",
              "main_systems",
              "last_reviewed",
              "review_confidence",
              "generated_by",
              "validated_by",
          ]

          existing_chars = len(context_md.strip())
          existing_h2_count = len(re.findall(r"(?m)^##\s+", context_md))

          user_prompt = f"""Current {context_file}:
          {context_md}

          Recent changes (last 7 days of git log):
          {git_log or '(no commits in the last 7 days)'}

          Current repo structure:
          {repo_tree}

          Existing file stats:
          - characters: {existing_chars}
          - H2 headings: {existing_h2_count}

          Update {context_file} to reflect any changes. If nothing meaningful changed, return the file \
          unchanged.

          If an existing file is present and substantial, preserve section coverage and level of detail.
          Do not replace detailed sections with generic summaries. Keep key headings/tables/lists unless \
          the provided inputs clearly justify removal.

          Required frontmatter fields (must exist):
          {', '.join(template_frontmatter_fields)}

          Required H2 sections (must exist, even if value is n/a with one-line explanation):
          {chr(10).join(required_h2_headings)}

          If the current file contains a section titled `Recent changes (last 7 days of git log):`, \
          preserve that section and keep it in the output."""

          payload = {
              "model": os.environ['MODEL'],
              "input": [
                  {"role": "system", "content": system_prompt},
                  {"role": "user", "content": user_prompt},
              ],
          }

          req = urllib.request.Request(
              "https://api.openai.com/v1/responses",
              data=json.dumps(payload).encode(),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {os.environ['OPENAI_API_KEY']}",
              },
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  body = json.loads(resp.read())
          except urllib.error.HTTPError as e:
              err_body = e.read().decode("utf-8", errors="replace") if e.fp else ""
              raise RuntimeError(f"OpenAI API request failed: HTTP {e.code} {e.reason}\n{err_body}")

          content = body.get("output_text")
          if not content:
              output = body.get("output", [])
              chunks = []
              for item in output:
                  for part in item.get("content", []):
                      if part.get("type") in ("output_text", "text") and "text" in part:
                          chunks.append(part["text"])
              content = "".join(chunks)

          if not content:
              raise RuntimeError(f"OpenAI API response did not include output text. Body: {json.dumps(body)}")

          recent_header = "Recent changes (last 7 days of git log):"

          def normalize_newline(md: str) -> str:
              return md.rstrip() + "\n"

          def replace_recent_changes_if_present(source_md: str, generated_md: str, git_log_text: str) -> str:
              if recent_header not in source_md:
                  return generated_md

              recent_body = git_log_text or "(no commits in the last 7 days)"
              recent_block = f"{recent_header}\n{recent_body}"
              section_pattern = re.compile(
                  rf"{re.escape(recent_header)}\n.*?(?=\n## |\Z)",
                  re.DOTALL,
              )

              if section_pattern.search(generated_md):
                  return section_pattern.sub(recent_block, generated_md, count=1)

              return generated_md.rstrip() + "\n\n" + recent_block

          def upsert_frontmatter_field(md: str, key: str, value: str) -> str:
              fm_match = re.match(r"\A---\n(.*?)\n---\n", md, re.DOTALL)
              if not fm_match:
                  return md

              fm = fm_match.group(1)
              key_pattern = re.compile(rf"(?m)^{re.escape(key)}:\s*.*$")
              line = f"{key}: {value}"

              if key_pattern.search(fm):
                  fm = key_pattern.sub(line, fm, count=1)
              else:
                  fm = fm.rstrip("\n") + "\n" + line

              return md[: fm_match.start()] + f"---\n{fm}\n---\n" + md[fm_match.end():]

          def upsert_freshness_bullet(md: str, key: str, value: str) -> str:
              section_match = re.search(r"(?ms)^##\s+Freshness\s*$\n(.*?)(?=^##\s+|\Z)", md)
              bullet_line = f"- `{key}`: {value}"
              bullet_pattern = re.compile(rf"(?m)^[-*]\s+`?{re.escape(key)}`?:\s*.*$")

              if section_match:
                  body = section_match.group(1)
                  if bullet_pattern.search(body):
                      body = bullet_pattern.sub(bullet_line, body, count=1)
                  else:
                      body = body.rstrip("\n") + "\n" + bullet_line + "\n"
                  return md[: section_match.start(1)] + body + md[section_match.end(1):]

              append = "\n\n## Freshness\n" + bullet_line + "\n"
              return md.rstrip("\n") + append

          content = replace_recent_changes_if_present(context_md, content, git_log)
          content = normalize_newline(content)

          source_normalized = normalize_newline(context_md)

          def count_h2(md: str) -> int:
              return len(re.findall(r"(?m)^##\s+", md))

          def present_required_h2(md: str, required: list[str]) -> int:
              return sum(1 for h in required if h in md)

          # Quality gate: if we already have a substantial context file, reject outputs
          # that lose too much structure/detail.
          source_substantial = len(source_normalized.strip()) >= 2500 and count_h2(source_normalized) >= 10
          generated_too_small = len(content.strip()) < int(len(source_normalized.strip()) * 0.7)
          generated_h2_lossy = count_h2(content) < max(8, int(count_h2(source_normalized) * 0.7))
          required_h2_missing = present_required_h2(content, required_h2_headings) < max(8, len(required_h2_headings) - 2)

          if source_substantial and (generated_too_small or generated_h2_lossy or required_h2_missing):
              print("Generated output failed quality gate; preserving existing context content.")
              content = source_normalized

          model_changed = content != source_normalized

          if model_changed:
              today = datetime.now(timezone.utc).date().isoformat()
              content = upsert_frontmatter_field(content, "last_reviewed", today)
              content = upsert_freshness_bullet(content, "last_reviewed", today)
              content = upsert_freshness_bullet(content, "generated_by", "CI-generated")

          content = normalize_newline(content)

          os.makedirs(os.path.dirname(context_file) or ".", exist_ok=True)

          with open(context_file, "w") as f:
              f.write(content)

          print(f"{context_file} written successfully.")
          PYEOF

      - name: Check for changes
        id: diff
        env:
          CONTEXT_FILE: ${{ inputs.context_file }}
          CASE_MISMATCH_PATH: ${{ steps.guard.outputs.case_mismatch_path }}
        run: |
          if [ "${{ steps.guard.outputs.should_run }}" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          paths=("$CONTEXT_FILE")
          if [ -n "$CASE_MISMATCH_PATH" ] && [ "$CASE_MISMATCH_PATH" != "$CONTEXT_FILE" ]; then
            paths+=("$CASE_MISMATCH_PATH")
          fi

          # Use porcelain status instead of `git diff --quiet` so untracked files
          # (e.g. first-time creation of AI/CONTEXT.md) are detected.
          if [ -n "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create branch, commit, and open PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT_FILE: ${{ inputs.context_file }}
          CASE_MISMATCH_PATH: ${{ steps.guard.outputs.case_mismatch_path }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH_BASE="chore/context-update-${DATE}"
          BRANCH="$BRANCH_BASE"

          # Avoid non-fast-forward push failures on reruns/same-day runs by
          # falling back to a unique branch name if today's branch already exists.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            TS=$(date +%H%M%S)
            BRANCH="${BRANCH_BASE}-${TS}-${GITHUB_RUN_ATTEMPT}"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"

          if [ -n "$CASE_MISMATCH_PATH" ] && [ "$CASE_MISMATCH_PATH" != "$CONTEXT_FILE" ]; then
            if git ls-files --error-unmatch -- "$CASE_MISMATCH_PATH" >/dev/null 2>&1; then
              git rm -- "$CASE_MISMATCH_PATH"
            else
              rm -f -- "$CASE_MISMATCH_PATH"
            fi
          fi

          git add "$CONTEXT_FILE"
          git commit -m "chore: regenerate ${CONTEXT_FILE}"
          git push -u origin "$BRANCH"

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "chore: regenerate ${CONTEXT_FILE} (${DATE})" \
            --body "$(cat <<EOF
          ## Automated ${CONTEXT_FILE} update

          This PR was generated by the [Regenerate Context File](.github/workflows/regenerate-context.yaml) reusable workflow.

          **Please review before merging:**
          - Verify the changes accurately reflect the current state of the repo
          - Check that no sensitive information was added
          - Update the \`validated_by\` field in the Freshness section (if present) if you are approving this

          If the changes look wrong, close this PR and update ${CONTEXT_FILE} manually.
          EOF
          )"
