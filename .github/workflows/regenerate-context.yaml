name: Regenerate Context File

on:
  workflow_call:
    outputs:
      changed:
        description: "Whether CONTEXT regeneration produced changes"
        value: ${{ jobs.regenerate.outputs.changed }}
    inputs:
      context_file:
        description: "Path (relative to repo root) of the context file to keep up to date."
        required: false
        type: string
        default: "AI/CONTEXT.md"
      base_branch:
        description: "Optional branch override for checkout and PR base. Defaults to the repository default branch when empty."
        required: false
        type: string
        default: ""
      tree_dirs:
        description: 'Comma-separated list of directories (relative to repo root) to summarize for the model. Use "." for the repo root.'
        required: false
        type: string
        default: "."
      tree_depth:
        description: "How many levels below each entry in tree_dirs to list. 2 stops above the environment directories in a monorepo (`projects/web` but not `projects/web/development`), which produces noticeably vaguer context files. Raising this is usually better than naming deeper directories by hand in tree_dirs."
        required: false
        type: string
        default: "3"
      repo_owner:
        description: "Who owns the repo?"
        required: false
        type: string
        default: "UNSET — please set this in the workflow call"
      model:
        description: "OpenAI model to use for regenerating the context file."
        required: false
        type: string
        default: "gpt-5.6"
      prompt_addition:
        description: "Optional extra instructions appended to the default system prompt (e.g. repo-specific conventions)."
        required: false
        type: string
        default: ""
    secrets:
      OPENAI_API_KEY:
        description: "API key for the OpenAI account used to regenerate the context file."
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch != '' && inputs.base_branch || github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Check for non-automation commits since last context PR merge
        id: guard
        env:
          CONTEXT_FILE: ${{ inputs.context_file }}
        run: |
          set -euo pipefail

          # Only the existence check lives here. Which spelling the file is under is decided
          # by gather_context.find_case_variant via the action, so there is one implementation
          # of it -- and it reads the git index rather than scanning the filesystem, which is
          # the only way to tell `AI/CONTEXT.md` from `ai/context.md` on a case-insensitive
          # filesystem. Either way the answer does not change should_run: a missing canonical
          # path forces a run whether or not a variant exists.
          if [ ! -f "$CONTEXT_FILE" ]; then
            echo "${CONTEXT_FILE} does not exist; forcing regeneration."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Marker commits created by this workflow when regeneration PRs are merged.
          LAST_AUTOMATION_COMMIT="$(git log --format='%H' -n 1 \
            --grep='^chore: regenerate ' \
            --grep='^Merge pull request .* from .*/chore/context-update-')"

          if [ -z "$LAST_AUTOMATION_COMMIT" ]; then
            echo "No prior automation merge marker found; proceeding with regeneration."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Count commits since the last marker, excluding commits generated by this
          # automation itself, to prevent infinite regeneration loops.
          NON_AUTOMATION_COUNT="$(git log --format='%H' "${LAST_AUTOMATION_COMMIT}..HEAD" \
            --invert-grep \
            --grep='^chore: regenerate ' \
            --grep='^Merge pull request .* from .*/chore/context-update-' \
            | wc -l | tr -d ' ')"

          if [ "$NON_AUTOMATION_COUNT" -eq 0 ]; then
            echo "No non-automation commits since last context PR merge; skipping regeneration."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found $NON_AUTOMATION_COUNT non-automation commit(s) since last context PR merge."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      # The regeneration logic lives in this repository's root action.yml so there is exactly
      # one copy of it -- see that file for why a `./`-relative reference cannot work from
      # inside a reusable workflow. The ref must be bumped in lockstep with the tag this
      # workflow ships in; tests/test_regenerator_wiring.py asserts it stays a pinned tag on
      # this repository rather than a branch or a relative path.
      - name: Gather context and regenerate
        id: regenerate
        if: steps.guard.outputs.should_run == 'true'
        uses: guidion-digital/context-layer@0.0.17
        with:
          context_file: ${{ inputs.context_file }}
          tree_dirs: ${{ inputs.tree_dirs }}
          tree_depth: ${{ inputs.tree_depth }}
          repo_owner: ${{ inputs.repo_owner }}
          model: ${{ inputs.model }}
          prompt_addition: ${{ inputs.prompt_addition }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}

      - name: Check for changes
        id: diff
        env:
          CONTEXT_FILE: ${{ inputs.context_file }}
          CASE_MISMATCH_PATH: ${{ steps.regenerate.outputs.case_variant }}
        run: |
          if [ "${{ steps.guard.outputs.should_run }}" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          paths=("$CONTEXT_FILE")
          if [ -n "$CASE_MISMATCH_PATH" ] && [ "$CASE_MISMATCH_PATH" != "$CONTEXT_FILE" ]; then
            paths+=("$CASE_MISMATCH_PATH")
          fi

          # Use porcelain status instead of `git diff --quiet` so untracked files
          # (e.g. first-time creation of AI/CONTEXT.md) are detected.
          if [ -n "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create branch, commit, and open PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT_FILE: ${{ inputs.context_file }}
          CASE_MISMATCH_PATH: ${{ steps.regenerate.outputs.case_variant }}
          BASE_BRANCH: ${{ inputs.base_branch != '' && inputs.base_branch || github.event.repository.default_branch }}
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH_BASE="chore/context-update-${DATE}"
          BRANCH="$BRANCH_BASE"

          # Avoid non-fast-forward push failures on reruns/same-day runs by
          # falling back to a unique branch name if today's branch already exists.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            TS=$(date +%H%M%S)
            BRANCH="${BRANCH_BASE}-${TS}-${GITHUB_RUN_ATTEMPT}"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"

          if [ -n "$CASE_MISMATCH_PATH" ] && [ "$CASE_MISMATCH_PATH" != "$CONTEXT_FILE" ]; then
            if git ls-files --error-unmatch -- "$CASE_MISMATCH_PATH" >/dev/null 2>&1; then
              git rm -- "$CASE_MISMATCH_PATH"
            else
              rm -f -- "$CASE_MISMATCH_PATH"
            fi
          fi

          git add "$CONTEXT_FILE"
          git commit -m "chore: regenerate ${CONTEXT_FILE}"
          git push -u origin "$BRANCH"

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "chore: regenerate ${CONTEXT_FILE} (${DATE})" \
            --body "$(cat <<EOF
          ## Automated ${CONTEXT_FILE} update

          This PR was generated by the [Regenerate Context File](.github/workflows/regenerate-context.yaml) reusable workflow.

          **Please review before merging:**
          - Verify the changes accurately reflect the current state of the repo
          - Check that no sensitive information was added
          - Update the \`validated_by\` field in the Freshness section (if present) if you are approving this

          If the changes look wrong, close this PR and update ${CONTEXT_FILE} manually.
          EOF
          )"
